<VirtualHost *:80>
    ServerName mobile.aurict.com

    # HTTP -> HTTPS redirect
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mobile.aurict.com

    # SSL (certbot bu satırları otomatik doldurur)
    # SSLEngine on
    # SSLCertificateFile     /etc/letsencrypt/live/mobile.aurict.com/fullchain.pem
    # SSLCertificateKeyFile  /etc/letsencrypt/live/mobile.aurict.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket desteği (Next.js HMR için)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3377/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3377/
    ProxyPassReverse / http://127.0.0.1:3377/

    # Loglar
    ErrorLog  ${APACHE_LOG_DIR}/mobile_aurict_error.log
    CustomLog ${APACHE_LOG_DIR}/mobile_aurict_access.log combined
</VirtualHost>
